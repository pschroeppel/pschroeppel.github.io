<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{{ page.title }}</title>
    <meta name="author" content="{{ page.author | default: 'Philipp Schröppel' }}">
    {% if page.description %}<meta name="description" content="{{ page.description }}">{% endif %}
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="shortcut icon" href="{{ '/images/favicon/favicon.ico' | relative_url }}" type="image/x-icon">
    <link rel="stylesheet" type="text/css" href="{{ '/assets/post.css' | relative_url }}">
  </head>

  <body>
    <main class="post">
      <nav class="post-nav">
        <a href="{{ '/' | relative_url }}">← Go back</a>
      </nav>

      <header class="post-header">
        <h1>{{ page.title }}</h1>
        <p class="post-meta">
          {% if page.author %}<span class="post-author">{{ page.author }}</span> &middot; {% endif %}<time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
        </p>
      </header>

      <article class="post-content">
        {{ content }}
      </article>
    </main>
  </body>
</html>
